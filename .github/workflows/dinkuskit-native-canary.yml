name: DinkusKit native ClawSweeper relay

# Event transport only. Model execution and subscription authentication stay
# on the maintainer-managed Spark runtime. No product source is checked out.
on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Exact repository name inside DinkusKit
        required: true
        type: string
      target_repository_id:
        description: Exact numeric repository ID
        required: true
        type: string
      pr_number:
        description: Exact open pull request number
        required: true
        type: string
      expected_base_sha:
        description: Exact current base SHA
        required: true
        type: string
      expected_head_sha:
        description: Exact PR head SHA
        required: true
        type: string
      publish:
        description: Publish native review comments, labels, and state
        required: true
        type: boolean
        default: false
      queue_mode:
        description: Queue dual-write mode (off, shadow, or primary)
        required: false
        type: string
        default: "off"
      force_label_by:
        description: Verified maintainer who applied the clawsweeper:review force label (#269)
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      target_repository:
        description: Exact repository name inside DinkusKit
        required: true
        type: string
      target_repository_id:
        description: Exact numeric repository ID
        required: true
        type: string
      pr_number:
        description: Exact open pull request number
        required: true
        type: string
      expected_base_sha:
        description: Exact current base SHA
        required: true
        type: string
      expected_head_sha:
        description: Exact PR head SHA
        required: true
        type: string
      publish:
        description: Publish native review comments, labels, and state
        required: true
        type: boolean
      queue_mode:
        description: Queue dual-write mode (off, shadow, or primary)
        required: false
        type: string
        default: "off"
      force_label_by:
        description: Verified maintainer who applied the clawsweeper:review force label (#269)
        required: false
        type: string
        default: ""
    secrets:
      CLAWSWEEPER_DISPATCH_TOKEN:
        description: Scoped credential for the private review event receiver
        required: true
      CLAWSWEEPER_DO_QUEUE_SECRET:
        description: Shared HMAC secret for the review intake queue (shadow/primary modes)
        required: false

permissions: {}

jobs:
  relay:
    if: vars.CLAWSWEEPER_SPARK_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prepare the native request
        env:
          GH_TOKEN: ${{ secrets.CLAWSWEEPER_DISPATCH_TOKEN }}
          RELAY_REPOSITORY: ${{ vars.CLAWSWEEPER_RELAY_REPOSITORY }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_BASE: ${{ inputs.expected_base_sha }}
          REQUESTED_HEAD: ${{ inputs.expected_head_sha }}
          PUBLISH: ${{ inputs.publish }}
          ORIGIN_REPOSITORY: ${{ github.repository }}
          ORIGIN_RUN_ID: ${{ github.run_id }}
          ORIGIN_RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMENT_ID: ${{ github.event.comment.id }}
          FORCE_LABEL_BY: ${{ inputs.force_label_by }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo 'Review event credential is not configured.' >&2; exit 1; }
          python3 -I - <<'PYREQUEST' > "$RUNNER_TEMP/clawsweeper-request.json"
          import json, os, re
          def field(name, pattern):
              value = os.environ.get(name, '')
              if not re.fullmatch(pattern, value):
                  raise SystemExit('Invalid review input: ' + name)
              return value
          field('RELAY_REPOSITORY', r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+')
          target = field('TARGET_REPOSITORY', r'[A-Za-z0-9_.-]+')
          publish = field('PUBLISH', r'true|false') == 'true'
          payload = {
              'target_repo': 'dinkuskit/' + target,
              'repository_id': field('TARGET_REPOSITORY_ID', r'[1-9][0-9]*'),
              'pr': field('PR_NUMBER', r'[1-9][0-9]*'),
              'requested_base': field('REQUESTED_BASE', r'[0-9a-f]{40}'),
              'requested_head': field('REQUESTED_HEAD', r'[0-9a-f]{40}'),
              'origin_repository': field('ORIGIN_REPOSITORY', r'dinkuskit/[A-Za-z0-9_.-]+'),
              'origin_run_id': field('ORIGIN_RUN_ID', r'[1-9][0-9]*'),
              'origin_run_attempt': field('ORIGIN_RUN_ATTEMPT', r'[1-9][0-9]*'),
              'comment_id': os.environ.get('COMMENT_ID', ''),
              'publish': publish,
          }
          force_label_by = os.environ.get('FORCE_LABEL_BY', '')
          if force_label_by:
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9-]*', force_label_by):
                  raise SystemExit('Invalid review input: FORCE_LABEL_BY')
              payload['force_label_by'] = force_label_by
          print(json.dumps({'event_type': 'clawsweeper_native_pr', 'client_payload': payload}))
          PYREQUEST
      - name: Bind the request to this workflow attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clawsweeper-request-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clawsweeper-request.json
          if-no-files-found: error
          retention-days: 7
      - name: Send the bound request
        env:
          GH_TOKEN: ${{ secrets.CLAWSWEEPER_DISPATCH_TOKEN }}
          RELAY_REPOSITORY: ${{ vars.CLAWSWEEPER_RELAY_REPOSITORY }}
          CLAWSWEEPER_DO_QUEUE_MODE: ${{ inputs.queue_mode }}
          CLAWSWEEPER_DO_QUEUE_SECRET: ${{ secrets.CLAWSWEEPER_DO_QUEUE_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          queue_status=0
          python3 -I - <<'PYQUEUE' || queue_status=$?
          import hashlib, hmac, json, os, sys, urllib.error, urllib.request
          mode = os.environ.get('CLAWSWEEPER_DO_QUEUE_MODE', 'off').strip().lower()
          if mode not in ('shadow', 'primary'):
              print(f'ClawSweeper queue dual-write disabled (mode={mode or "off"}).')
              raise SystemExit(0)
          secret = os.environ.get('CLAWSWEEPER_DO_QUEUE_SECRET', '')
          if not secret:
              message = 'ClawSweeper queue secret is not configured.'
              if mode == 'primary':
                  print(message, file=sys.stderr); raise SystemExit(1)
              print(f'::warning::{message} Continuing with Actions in shadow mode.')
              raise SystemExit(0)
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'clawsweeper-request.json')) as handle:
              client_payload = json.load(handle)['client_payload']
          admit = {
              'requestId': f"native:{client_payload['origin_run_id']}:{client_payload['origin_run_attempt']}",
              'repository': client_payload['target_repo'],
              'pr': int(client_payload['pr']),
              'base': client_payload['requested_base'],
              'head': client_payload['requested_head'],
              'commentId': client_payload['comment_id'],
              'kind': 'command' if client_payload['comment_id'] else 'automatic',
              'clientPayload': client_payload,
          }
          raw = json.dumps(admit, separators=(',', ':')).encode()
          signature = 'sha256=' + hmac.new(secret.encode(), raw, hashlib.sha256).hexdigest()
          request = urllib.request.Request(
              'https://queue.ztoned.com/internal/intake/admit', data=raw, method='POST',
              headers={'content-type': 'application/json', 'user-agent': 'clawsweeper-queue-client/1.0', 'x-clawsweeper-exact-review-signature': signature})
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  result = json.load(response)
              if result.get('accepted') is not True:
                  raise ValueError(f"queue rejected admit: {result.get('reason', 'unknown')}")
              print(f"ClawSweeper queue {mode} admit accepted (deduped={result.get('deduped') is True}).")
              raise SystemExit(86 if mode == 'primary' else 0)
          except Exception as error:
              if mode == 'primary':
                  print(f'ClawSweeper queue primary admit failed: {error}', file=sys.stderr)
                  raise SystemExit(1)
              print(f'::warning::ClawSweeper queue shadow admit failed; continuing with Actions: {error}')
              raise SystemExit(0)
          PYQUEUE
          if [ "$queue_status" -eq 86 ]; then
            echo 'Queue is primary for this repository; skipping Actions repository_dispatch.'
            exit 0
          fi
          [ "$queue_status" -eq 0 ] || exit "$queue_status"
          gh api --method POST "repos/$RELAY_REPOSITORY/dispatches" --input "$RUNNER_TEMP/clawsweeper-request.json"
          echo 'Native request delivered. Review completion is recorded by the subscription runtime.'
