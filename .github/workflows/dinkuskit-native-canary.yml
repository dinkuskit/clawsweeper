name: DinkusKit native ClawSweeper relay

# Event transport only. Model execution and subscription authentication stay
# on the maintainer-managed Spark runtime. No product source is checked out.
on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Exact repository name inside DinkusKit
        required: true
        type: string
      target_repository_id:
        description: Exact numeric repository ID
        required: true
        type: string
      pr_number:
        description: Exact open pull request number
        required: true
        type: string
      expected_base_sha:
        description: Exact current base SHA
        required: true
        type: string
      expected_head_sha:
        description: Exact PR head SHA
        required: true
        type: string
      publish:
        description: Publish native review comments, labels, and state
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      target_repository:
        description: Exact repository name inside DinkusKit
        required: true
        type: string
      target_repository_id:
        description: Exact numeric repository ID
        required: true
        type: string
      pr_number:
        description: Exact open pull request number
        required: true
        type: string
      expected_base_sha:
        description: Exact current base SHA
        required: true
        type: string
      expected_head_sha:
        description: Exact PR head SHA
        required: true
        type: string
      publish:
        description: Publish native review comments, labels, and state
        required: true
        type: boolean
    secrets:
      CLAWSWEEPER_DISPATCH_TOKEN:
        description: Scoped credential for the private review event receiver
        required: true

permissions: {}

jobs:
  relay:
    if: vars.CLAWSWEEPER_SPARK_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prepare the native request
        env:
          GH_TOKEN: ${{ secrets.CLAWSWEEPER_DISPATCH_TOKEN }}
          RELAY_REPOSITORY: ${{ vars.CLAWSWEEPER_RELAY_REPOSITORY }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REQUESTED_BASE: ${{ inputs.expected_base_sha }}
          REQUESTED_HEAD: ${{ inputs.expected_head_sha }}
          PUBLISH: ${{ inputs.publish }}
          ORIGIN_REPOSITORY: ${{ github.repository }}
          ORIGIN_RUN_ID: ${{ github.run_id }}
          ORIGIN_RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo 'Review event credential is not configured.' >&2; exit 1; }
          python3 -I - <<'PYREQUEST' > "$RUNNER_TEMP/clawsweeper-request.json"
          import json, os, re
          def field(name, pattern):
              value = os.environ.get(name, '')
              if not re.fullmatch(pattern, value):
                  raise SystemExit('Invalid review input: ' + name)
              return value
          field('RELAY_REPOSITORY', r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+')
          target = field('TARGET_REPOSITORY', r'[A-Za-z0-9_.-]+')
          publish = field('PUBLISH', r'true|false') == 'true'
          payload = {
              'target_repo': 'dinkuskit/' + target,
              'repository_id': field('TARGET_REPOSITORY_ID', r'[1-9][0-9]*'),
              'pr': field('PR_NUMBER', r'[1-9][0-9]*'),
              'requested_base': field('REQUESTED_BASE', r'[0-9a-f]{40}'),
              'requested_head': field('REQUESTED_HEAD', r'[0-9a-f]{40}'),
              'origin_repository': field('ORIGIN_REPOSITORY', r'dinkuskit/[A-Za-z0-9_.-]+'),
              'origin_run_id': field('ORIGIN_RUN_ID', r'[1-9][0-9]*'),
              'origin_run_attempt': field('ORIGIN_RUN_ATTEMPT', r'[1-9][0-9]*'),
              'comment_id': os.environ.get('COMMENT_ID', ''),
              'publish': publish,
          }
          print(json.dumps({'event_type': 'clawsweeper_native_pr', 'client_payload': payload}))
          PYREQUEST
      - name: Bind the request to this workflow attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clawsweeper-request-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clawsweeper-request.json
          if-no-files-found: error
          retention-days: 7
        if: vars.CLAWSWEEPER_DO_QUEUE_MODE != 'primary' || steps.admit-do-queue.outcome != 'success'
      - name: Admit the request to the Durable Object queue
        id: admit-do-queue
        if: vars.CLAWSWEEPER_DO_QUEUE_MODE == 'shadow' || vars.CLAWSWEEPER_DO_QUEUE_MODE == 'primary'
        continue-on-error: true
        env:
          QUEUE_MODE: ${{ vars.CLAWSWEEPER_DO_QUEUE_MODE }}
          QUEUE_URL: ${{ vars.CLAWSWEEPER_DO_QUEUE_URL }}
          QUEUE_SECRET: ${{ secrets.CLAWSWEEPER_DO_QUEUE_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/clawsweeper-request.json" <<'PYQUEUE'
          import hashlib
          import hmac
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          request_path = sys.argv[1]
          mode = os.environ.get("QUEUE_MODE", "")
          queue_url = os.environ.get("QUEUE_URL", "").strip().rstrip("/")
          secret = os.environ.get("QUEUE_SECRET", "")

          parsed = urllib.parse.urlparse(queue_url)
          hostname = (parsed.hostname or "").lower()
          if parsed.scheme != "https" or not hostname or hostname == "workers.dev" or hostname.endswith(".workers.dev"):
              raise SystemExit("Durable Object queue URL must be an HTTPS non-workers.dev URL")
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("Durable Object queue URL contains unsupported components")
          if not secret:
              raise SystemExit("Durable Object queue secret is not configured")

          with open(request_path, encoding="utf-8") as request_file:
              body = request_file.read().encode("utf-8")
          signature = "sha256=" + hmac.new(
              secret.encode("utf-8"), body, hashlib.sha256
          ).hexdigest()
          request = urllib.request.Request(
              queue_url + "/admit",
              data=body,
              method="POST",
              headers={
                  "content-type": "application/json",
                  "x-clawsweeper-queue-signature": signature,
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  if not 200 <= response.status < 300:
                      raise RuntimeError(f"queue admission returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              raise RuntimeError(f"queue admission returned HTTP {error.code}") from error
          except urllib.error.URLError as error:
              raise RuntimeError("queue admission request failed") from error
          print(f"Durable Object queue admission succeeded ({mode}).")
          PYQUEUE
      - name: Send the bound request
        if: vars.CLAWSWEEPER_DO_QUEUE_MODE != 'primary' || steps.admit-do-queue.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.CLAWSWEEPER_DISPATCH_TOKEN }}
          RELAY_REPOSITORY: ${{ vars.CLAWSWEEPER_RELAY_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$RELAY_REPOSITORY/dispatches" --input "$RUNNER_TEMP/clawsweeper-request.json"
          echo 'Native request delivered. Review completion is recorded by the subscription runtime.'
